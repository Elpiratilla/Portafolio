<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f5fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1424" media="(prefers-color-scheme: dark)">
<title>Inventario · Demo</title>
<meta name="description" content="Demo de sistema de inventario con Node.js y SQLite: productos, stock mínimo, alertas y valor del inventario.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d7f64'/%3E%3C/svg%3E">
<style>
:root{--bg:#f2f5fa;--surface:#fff;--ink:#101a30;--muted:#55627d;--line:#d7deec;--ok:#0d7f64;--ok-soft:#d9f0e9;--warn:#b42318;--warn-soft:#fde4e1;--a:#2447d6;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--surface:#161e33;--ink:#eaf0ff;--muted:#9aa8c7;--line:#27324d;--ok:#4fd1ae;--ok-soft:#143a33;--warn:#ff8a7a;--warn-soft:#4a1d19;--a:#7f9bff}}
:root[data-theme="dark"]{--bg:#0e1424;--surface:#161e33;--ink:#eaf0ff;--muted:#9aa8c7;--line:#27324d;--ok:#4fd1ae;--ok-soft:#143a33;--warn:#ff8a7a;--warn-soft:#4a1d19;--a:#7f9bff}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--a);outline-offset:2px}
header{padding:28px 0 8px}
.volver{display:inline-flex;align-items:center;min-height:44px;font-weight:600;color:var(--ink)}
h1{margin:8px 0 0;font-size:clamp(1.8rem,6vw,2.6rem);font-weight:800;letter-spacing:-.02em}
.modo{margin:10px 0 0;padding:10px 14px;border-radius:10px;font-size:.92rem;background:var(--ok-soft);color:var(--ink);border:1px solid var(--line)}
.resumen{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card small{display:block;color:var(--muted);font-size:.85rem}
.card strong{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.card.alerta strong{color:var(--warn)}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 14px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 12px}
.bar input{flex:1 1 220px}
button{font:inherit;font-weight:600;min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
button.alt{background:transparent;color:var(--ink)}
button.mini{min-height:36px;min-width:36px;padding:0 10px}
.tabla{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.85rem;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.bajo td:first-child{box-shadow:inset 4px 0 0 var(--warn)}
.etq{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:6px;background:var(--warn-soft);color:var(--warn);font-size:.78rem;font-weight:700}
.stock{display:inline-flex;align-items:center;gap:6px}
.acc{display:flex;gap:6px;justify-content:flex-end}
.vacio{padding:28px;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:22px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog form{display:grid;gap:12px}
dialog label{display:grid;gap:4px;font-weight:600;font-size:.92rem}
dialog .fila{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog h2{margin:0 0 4px;font-size:1.3rem}
.err{color:var(--warn);min-height:1.2em;margin:0;font-size:.92rem}
.pie{display:flex;gap:10px;justify-content:flex-end}
footer{padding:20px 0 48px;color:var(--muted);font-size:.9rem}
@media (max-width:760px){.resumen{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="wrap">
  <a class="volver" href="../../../index.html">Volver al portafolio</a>
  <h1>Inventario</h1>
  <p class="modo" id="modo" role="status"></p>
</header>

<main class="wrap">
  <div class="resumen" id="resumen"></div>
  <div class="bar">
    <input id="buscar" type="search" placeholder="Buscar producto o categoría" aria-label="Buscar producto o categoría" autocomplete="off">
    <select id="solo" aria-label="Filtro de stock"><option value="todos">Todos</option><option value="bajo">Solo stock bajo</option></select>
    <button type="button" id="nuevo">Agregar producto</button>
  </div>
  <div class="tabla">
    <table>
      <thead><tr><th>Producto</th><th>Categoría</th><th class="num">Stock</th><th class="num">Mínimo</th><th class="num">Precio</th><th><span style="position:absolute;left:-9999px">Acciones</span></th></tr></thead>
      <tbody id="filas"></tbody>
    </table>
  </div>
</main>

<footer class="wrap">Demo para el portafolio. <button type="button" class="alt mini" id="tema">Cambiar tema</button></footer>

<dialog id="dlg" aria-labelledby="dlg-t">
  <form id="form" novalidate>
    <h2 id="dlg-t">Producto</h2>
    <label>Nombre<input name="nombre" required maxlength="80"></label>
    <label>Categoría<input name="categoria" maxlength="40" value="General"></label>
    <div class="fila">
      <label>Stock<input name="stock" type="number" min="0" step="1" value="0" inputmode="numeric"></label>
      <label>Stock mínimo<input name="minimo" type="number" min="0" step="1" value="0" inputmode="numeric"></label>
    </div>
    <label>Precio (USD)<input name="precio" type="number" min="0" step="0.01" value="0" inputmode="decimal"></label>
    <p class="err" id="err" role="alert"></p>
    <div class="pie"><button type="button" class="alt" id="cancelar">Cancelar</button><button type="submit">Guardar</button></div>
  </form>
</dialog>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd = n => "$" + Number(n).toFixed(2);

/* Misma validación que el servidor, para avisar antes de enviar */
function validar(d) {
  const nombre = String(d.nombre || "").trim(), stock = Number(d.stock), minimo = Number(d.minimo), precio = Number(d.precio);
  if (!nombre) return { error: "El nombre es obligatorio." };
  if (!Number.isInteger(stock) || stock < 0) return { error: "El stock debe ser un número entero de 0 o más." };
  if (!Number.isInteger(minimo) || minimo < 0) return { error: "El mínimo debe ser un número entero de 0 o más." };
  if (!Number.isFinite(precio) || precio < 0) return { error: "El precio debe ser 0 o más." };
  return { datos: { nombre: nombre.slice(0, 80), categoria: (String(d.categoria || "").trim() || "General").slice(0, 40), stock, minimo, precio: Math.round(precio * 100) / 100 } };
}

/* ===== Dos "almacenes" con la misma forma: el servidor (Node + SQLite) o el navegador (localStorage) ===== */
const remoto = {
  nombre: "servidor",
  async listar() { const r = await fetch("api/productos"); if (!r.ok) throw new Error("api"); return r.json(); },
  async guardar(id, datos) {
    const r = await fetch(id ? "api/productos/" + id : "api/productos", { method: id ? "PUT" : "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(datos) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error || "Error"); return j;
  },
  async borrar(id) { const r = await fetch("api/productos/" + id, { method: "DELETE" }); if (!r.ok) throw new Error("Error"); }
};
const SEMILLA = [["Harina de maíz 1 kg","Abarrotes",40,15,1.1],["Frijol rojo 1 lb","Abarrotes",12,20,0.95],["Aceite 900 ml","Abarrotes",25,10,2.8],["Queso duro 1 lb","Lácteos",6,8,3.5],["Café molido 400 g","Bebidas",30,10,4.25]]
  .map((p, i) => ({ id: i + 1, nombre: p[0], categoria: p[1], stock: p[2], minimo: p[3], precio: p[4] }));
const local = {
  nombre: "navegador",
  _leer() { try { const v = JSON.parse(localStorage.getItem("inv-demo")); if (Array.isArray(v)) return v; } catch {} return SEMILLA.map(x => ({ ...x })); },
  _poner(v) { try { localStorage.setItem("inv-demo", JSON.stringify(v)); } catch {} },
  async listar() { return this._leer().sort((a, b) => a.nombre.localeCompare(b.nombre, "es")); },
  async guardar(id, datos) {
    const v = this._leer();
    if (id) { const i = v.findIndex(p => p.id === id); v[i] = { ...datos, id }; this._poner(v); return v[i]; }
    const nuevo = { ...datos, id: Math.max(0, ...v.map(p => p.id)) + 1 }; v.push(nuevo); this._poner(v); return nuevo;
  },
  async borrar(id) { this._poner(this._leer().filter(p => p.id !== id)); }
};

let almacen = remoto, productos = [], editando = null;

async function iniciar() {
  try { productos = await remoto.listar(); almacen = remoto;
    $("modo").textContent = "Conectado al servidor: los datos se guardan en una base de datos SQLite.";
  } catch {
    almacen = local; productos = await local.listar();
    $("modo").textContent = "Modo demostración: no hay servidor, así que los datos se guardan solo en este navegador. Para verlo con base de datos, ejecuta npm start en la carpeta demos/inventario.";
  }
  pintar();
}

function pintar() {
  const q = $("buscar").value.trim().toLowerCase(), soloBajo = $("solo").value === "bajo";
  const total = productos.length, unidades = productos.reduce((s, p) => s + p.stock, 0);
  const valor = productos.reduce((s, p) => s + p.stock * p.precio, 0), bajo = productos.filter(p => p.stock <= p.minimo).length;
  $("resumen").innerHTML = `<div class="card"><small>Productos</small><strong>${total}</strong></div><div class="card"><small>Unidades en stock</small><strong>${unidades}</strong></div><div class="card"><small>Valor del inventario</small><strong>${usd(valor)}</strong></div><div class="card${bajo ? " alerta" : ""}"><small>Con stock bajo</small><strong>${bajo}</strong></div>`;
  const lista = productos.filter(p => (!q || (p.nombre + " " + p.categoria).toLowerCase().includes(q)) && (!soloBajo || p.stock <= p.minimo));
  $("filas").innerHTML = lista.length ? lista.map(p => {
    const b = p.stock <= p.minimo;
    return `<tr class="${b ? "bajo" : ""}"><td>${esc(p.nombre)}${b ? '<span class="etq">Stock bajo</span>' : ""}</td><td>${esc(p.categoria)}</td>
      <td class="num"><span class="stock"><button type="button" class="alt mini" data-a="menos" data-id="${p.id}" aria-label="Restar una unidad a ${esc(p.nombre)}">−</button>${p.stock}<button type="button" class="alt mini" data-a="mas" data-id="${p.id}" aria-label="Sumar una unidad a ${esc(p.nombre)}">+</button></span></td>
      <td class="num">${p.minimo}</td><td class="num">${usd(p.precio)}</td>
      <td><div class="acc"><button type="button" class="alt mini" data-a="editar" data-id="${p.id}">Editar</button><button type="button" class="alt mini" data-a="borrar" data-id="${p.id}" aria-label="Eliminar ${esc(p.nombre)}">Eliminar</button></div></td></tr>`;
  }).join("") : `<tr><td colspan="6" class="vacio">No hay productos que coincidan. Cambia la búsqueda o agrega uno nuevo.</td></tr>`;
}

async function recargar() { productos = await almacen.listar(); pintar(); }

$("filas").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  const id = Number(b.dataset.id), p = productos.find(x => x.id === id); if (!p) return;
  try {
    if (b.dataset.a === "mas") await almacen.guardar(id, { ...p, stock: p.stock + 1 });
    else if (b.dataset.a === "menos") { if (p.stock === 0) return; await almacen.guardar(id, { ...p, stock: p.stock - 1 }); }
    else if (b.dataset.a === "borrar") { if (!confirm("¿Eliminar \"" + p.nombre + "\"? Esta acción no se puede deshacer.")) return; await almacen.borrar(id); }
    else if (b.dataset.a === "editar") return abrir(p);
    await recargar();
  } catch (er) { alert(er.message); }
});

function abrir(p) {
  editando = p ? p.id : null;
  $("dlg-t").textContent = p ? "Editar producto" : "Agregar producto";
  const f = $("form").elements; f.nombre.value = p ? p.nombre : ""; f.categoria.value = p ? p.categoria : "General";
  f.stock.value = p ? p.stock : 0; f.minimo.value = p ? p.minimo : 0; f.precio.value = p ? p.precio : 0;
  $("err").textContent = ""; $("dlg").showModal(); f.nombre.focus();
}
$("nuevo").addEventListener("click", () => abrir(null));
$("cancelar").addEventListener("click", () => $("dlg").close());
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const v = validar(Object.fromEntries(new FormData(e.target)));
  if (v.error) { $("err").textContent = v.error; return; }
  try { await almacen.guardar(editando, v.datos); $("dlg").close(); await recargar(); }
  catch (er) { $("err").textContent = er.message; }
});
$("buscar").addEventListener("input", pintar);
$("solo").addEventListener("change", pintar);
$("tema").addEventListener("click", () => {
  const r = document.documentElement;
  const oscuro = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = oscuro ? "light" : "dark";
});
iniciar();
</script>
</body>
</html>
